# ~/.tmux.conf
# Disesuaikan buat workflow: Termux (Android) + Neovim + vi-mode

# ── Prefix key ──────────────────────────────────────────────
# Ctrl-a lebih gampang dijangkau daripada Ctrl-b, apalagi di soft keyboard Termux
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General behavior ────────────────────────────────────────
set -g mouse on                  # tap/scroll buat resize pane & scroll history
set -g base-index 1              # window mulai dari 1, bukan 0
setw -g pane-base-index 1
set -g renumber-windows on       # auto renumber pas window ditutup
set -g history-limit 10000
set -g escape-time 0             # biar nvim gak lag pas kepencet Esc
set -g focus-events on
set -g allow-rename off

# 24-bit color, penting biar theme nvim/starship kamu akurat
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ── Vi-mode (konsisten sama nvim/zsh vi-mode kamu) ──────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── Pane navigation & split (mnemonic, mirip nvim split) ────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize pane pake prefix + HJKL (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Window management ────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind -r n next-window
bind -r p previous-window

# ── Reload config cepat ──────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# ── Status bar (minimalis, senada starship) ──────────────────
set -g status-position bottom
set -g status-style bg=default,fg=colour245
set -g status-left-length 20
set -g status-right-length 50
set -g status-left "#[fg=colour39,bold] #S "
set -g status-right "#[fg=colour245]%H:%M #[fg=colour39]#h "

setw -g window-status-current-style fg=colour39,bold
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# ── Clipboard integration Termux ──────────────────────────────
# Pastikan termux-api udah terinstall (pkg install termux-api)
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "termux-clipboard-set"
