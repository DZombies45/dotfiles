# ~/.tmux.conf
# Disesuaikan buat workflow: Termux (Android) + Neovim + vi-mode

# ── Prefix key ──────────────────────────────────────────────
# Ctrl-a lebih gampang dijangkau daripada Ctrl-b, apalagi di soft keyboard Termux
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General behavior ────────────────────────────────────────
set -g mouse on                  # tap/scroll buat resize pane & scroll history
set -g base-index 1              # window mulai dari 1, bukan 0
setw -g pane-base-index 1
set -g renumber-windows on       # auto renumber pas window ditutup
set -g history-limit 10000
set -g escape-time 0             # biar nvim gak lag pas kepencet Esc
set -g focus-events on
set -g allow-rename off

# 24-bit color, penting biar theme nvim/starship kamu akurat
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ── Vi-mode (konsisten sama nvim/zsh vi-mode kamu) ──────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── Pane navigation & split (mnemonic, mirip nvim split) ────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize pane pake prefix + HJKL (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Window management ────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind -r n next-window
bind -r p previous-window

# ── Reload config cepat ──────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# ── Tokyonight theme ──────────────────────────────────────────
# Palette resmi tokyonight (storm variant)
tokyo_bg="#1a1b26"
tokyo_bg_dark="#16161e"
tokyo_fg="#c0caf5"
tokyo_blue="#7aa2f7"
tokyo_cyan="#7dcfff"
tokyo_green="#9ece6a"
tokyo_magenta="#bb9af7"
tokyo_red="#f7768e"
tokyo_orange="#ff9e64"
tokyo_yellow="#e0af68"
tokyo_comment="#565f89"

set -g status-position bottom
set -g status-style "bg=${tokyo_bg},fg=${tokyo_fg}"
set -g status-left-length 30
set -g status-right-length 60

set -g status-left "#[bg=${tokyo_blue},fg=${tokyo_bg_dark},bold] #S #[bg=${tokyo_bg},fg=${tokyo_blue}]"
set -g status-right "#[fg=${tokyo_comment}]#[bg=${tokyo_comment},fg=${tokyo_bg_dark}] %H:%M #[bg=${tokyo_bg},fg=${tokyo_magenta}]#[bg=${tokyo_magenta},fg=${tokyo_bg_dark},bold] #h "

setw -g window-status-style "fg=${tokyo_comment},bg=${tokyo_bg}"
setw -g window-status-format " #I:#W "
setw -g window-status-current-style "fg=${tokyo_bg_dark},bg=${tokyo_green},bold"
setw -g window-status-current-format " #I:#W "

set -g pane-border-style "fg=${tokyo_comment}"
set -g pane-active-border-style "fg=${tokyo_blue}"

set -g message-style "bg=${tokyo_magenta},fg=${tokyo_bg_dark},bold"
set -g message-command-style "bg=${tokyo_yellow},fg=${tokyo_bg_dark},bold"

# ── Clipboard integration Termux ──────────────────────────────
# Pastikan termux-api udah terinstall (pkg install termux-api)
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "termux-clipboard-set"
